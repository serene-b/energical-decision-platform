version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: energical-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-energical_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-energical_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - energical-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energical-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-energical_platform}
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - energical-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energical-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - energical-network

volumes:
  pgdata:
    driver: local

networks:
  energical-network:
    driver: bridge
